# SHEcurify – Analysis Options
# ─────────────────────────────────────────────────────────────────────────────
# Enforces good Dart/Flutter code style without being overly strict
# for a prototype/college project.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - unnecessary_new
    - use_key_in_widget_constructors
